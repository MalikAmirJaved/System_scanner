[package]
name = "system-scanner"
version = "0.1.0"
description = "System Scanner desktop application"
authors = ["System Scanner"]
edition = "2024"

[lib]
name = "system_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
